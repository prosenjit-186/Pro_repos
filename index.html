<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Fun</title>
  <style>
    body {
      background-color: pink;
      text-align: center;
      padding-top: 100px;
      font-family: 'Brush Script MT', cursive; /* stylish font */
      background-image: url('https://i.ibb.co/7rYwYwM/cakes-hearts-background.png');
      background-size: cover;
      background-repeat: repeat;
      animation: flow 30s linear infinite;
    }
    @keyframes flow {
      from { background-position: 0 0; }
      to { background-position: 1000px 1000px; }
    }
    h1 {
      color: #d6336c;
      font-size: 2em;
      font-family: Arial, sans-serif;
    }
    button {
      font-size: 18px; /* slightly zoomed in */
      padding: 12px 24px;
      margin: 20px;
      cursor: pointer;
    }
    #birthday {
      display: none;
      font-size: 40px; /* bigger message */
      color: purple;
      margin-top: 50px;
      font-weight: bold;
      text-shadow: 2px 2px 5px #fff;
    }
  </style>
</head>
<body>
  <h1 id="question">What did you think of yourself?</h1>
  <div id="buttons">
    <button id="cute">Cute</button>
    <button id="ugly">Ugly</button>
  </div>
  <div id="birthday">🎉 Happy Birthday Ishita! 🎂💖</div>

  <script>
    let uglyMoves = 0;
    const uglyBtn = document.getElementById("ugly");
    const cuteBtn = document.getElementById("cute");
    const birthdayMsg = document.getElementById("birthday");
    const question = document.getElementById("question");
    const buttonsDiv = document.getElementById("buttons");

    uglyBtn.addEventListener("click", () => {
      if (uglyMoves < 3) {
        const x = Math.floor(Math.random() * 300);
        const y = Math.floor(Math.random() * 200);
        uglyBtn.style.position = "absolute";
        uglyBtn.style.left = x + "px";
        uglyBtn.style.top = y + "px";
        uglyMoves++;
      } else {
        uglyBtn.style.display = "none"; // hide ugly button after 3 attempts
      }
    });

    cuteBtn.addEventListener("click", () => {
      birthdayMsg.style.display = "block";
      question.style.display = "none";   // hide question
      buttonsDiv.style.display = "none"; // hide buttons
    });
  </script>
</body>
</html>
