<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro_Codes </title>
  <style>
    body {
      background-color: pink;
      text-align: center;
      padding-top: 100px;
      font-family: 'Brush Script MT', cursive;
      overflow: hidden;
    }
    h1 {
      color: #d6336c;
      font-size: 4em; /* doubled size */
      font-family: Arial, sans-serif;
      margin-bottom: 40px;
    }
    button {
      font-size: 40px; /* doubled size */
      padding: 24px 48px;
      margin: 30px;
      cursor: pointer;
      border: none;
      border-radius: 40px; /* rounded corners */
      background: linear-gradient(45deg, #ff99cc, #ff66b2); /* gradient */
      color: white;
      font-weight: bold;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    #birthday {
      display: none;
      font-size: 80px; /* big stylish message */
      color: purple;
      margin-top: 50px;
      font-weight: bold;
      text-shadow: 4px 4px 10px #fff;
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    /* Floating hearts and cakes */
    .float {
      position: absolute;
      font-size: 40px;
      animation: floatUp 12s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }
  </style>
</head>
<body>
  <h1 id="question">What do you think of yourself?</h1>
  <div id="buttons">
    <button id="cute">Cute</button>
    <button id="ugly">Ugly</button>
  </div>
  <div id="birthday">🎉 Happy Birthday Ishita! 🎂💖</div>

  <!-- Floating decorations -->
  <div class="float" style="left:10%;">💖</div>
  <div class="float" style="left:25%; animation-delay:2s;">🎂</div>
  <div class="float" style="left:40%; animation-delay:4s;">💖</div>
  <div class="float" style="left:60%; animation-delay:6s;">🎂</div>
  <div class="float" style="left:80%; animation-delay:8s;">💖</div>

  <script>
    let uglyMoves = 0;
    const uglyBtn = document.getElementById("ugly");
    const cuteBtn = document.getElementById("cute");
    const birthdayMsg = document.getElementById("birthday");
    const question = document.getElementById("question");
    const buttonsDiv = document.getElementById("buttons");

    uglyBtn.addEventListener("click", () => {
      if (uglyMoves < 3) {
        const x = Math.floor(Math.random() * 300);
        const y = Math.floor(Math.random() * 200);
        uglyBtn.style.position = "absolute";
        uglyBtn.style.left = x + "px";
        uglyBtn.style.top = y + "px";
        uglyMoves++;
      } else {
        uglyBtn.style.display = "none"; // hide ugly button after 3 attempts
      }
    });

    cuteBtn.addEventListener("click", () => {
      birthdayMsg.style.display = "block";
      question.style.display = "none";   // hide question
      buttonsDiv.style.display = "none"; // hide buttons
    });
  </script>
</body>
</html>
